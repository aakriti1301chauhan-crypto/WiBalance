<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiBalance | Network Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">W</div>
            <div>
                <h1>WiBalance</h1>
                <p>Intelligent Wi-Fi Traffic Management</p>
            </div>
        </div>
        <div class="connection">
            <span class="dot"></span>
            Simulation Dashboard
        </div>
    </header>

    <main class="container">
        <section class="welcome">
            <div>
                <p class="eyebrow">NETWORK OVERVIEW</p>
                <h2>Network Control Center</h2>
                <p class="muted">Monitor access points, traffic and network health.</p>
            </div>
            <div class="tick-box">
                <span>SIMULATION TICK</span>
                <strong id="tick">0 / 50</strong>
            </div>
        </section>

        <section class="stats">
            <article class="stat-card">
                <p>Total Access Points</p>
                <strong id="apCount">2</strong>
                <span>Network infrastructure</span>
            </article>
            <article class="stat-card">
                <p>Connected Users</p>
                <strong id="userCount">1</strong>
                <span>Simulated clients</span>
